<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETH — SCRIPT SEARCH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .reth-card { background: #080808; border: 1px solid #111; border-radius: 20px; transition: 0.3s; height: 100%; display: flex; flex-direction: column; }
        .reth-card:hover { border-color: #444; background: #0c0c0c; transform: translateY(-2px); }
        .search-box { background: #080808; border: 1px solid #111; border-radius: 12px; outline: none; transition: 0.3s; }
        .search-box:focus { border-color: #fff; }
        .loader { width: 20px; height: 20px; border: 2px solid #222; border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-6">

    <div class="max-w-6xl mx-auto">
        <header class="py-10">
            <h1 class="text-5xl font-black italic tracking-tighter uppercase">RETH SCRIPTS</h1>
            <p class="text-[10px] text-zinc-500 font-bold tracking-[0.4em] uppercase mt-1">Global Script Library</p>
        </header>

        <div class="relative mb-10">
            <input type="text" id="searchInput" placeholder="SEARCH SCRIPTS..." class="search-box w-full p-5 text-xs font-bold tracking-widest uppercase">
            <div id="loading" class="hidden absolute right-5 top-5"><div class="loader"></div></div>
        </div>

        <div id="scriptGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            </div>
    </div>

    <script>
        const scriptGrid = document.getElementById('scriptGrid');
        const searchInput = document.getElementById('searchInput');
        const loading = document.getElementById('loading');

        async function fetchScripts(query = "") {
            loading.classList.remove('hidden');
            
            try {
                // ใช้ Proxy ที่ทำงานได้ดีบน GitHub Pages
                const target = `https://scriptblox.com/api/script/search?q=${encodeURIComponent(query)}&max=20`;
                const url = `https://api.allorigins.win/get?url=${encodeURIComponent(target)}`;

                const response = await fetch(url);
                const json = await response.json();
                const data = JSON.parse(json.contents); // AllOrigins จะห่อข้อมูลไว้ใน contents

                if (data && data.result && data.result.scripts) {
                    render(data.result.scripts);
                } else {
                    scriptGrid.innerHTML = '<p class="col-span-full text-zinc-600 text-[10px] font-bold uppercase">No results found.</p>';
                }
            } catch (err) {
                console.error(err);
                scriptGrid.innerHTML = '<p class="col-span-full text-red-500 text-[10px] font-bold uppercase">Error loading scripts. Please refresh.</p>';
            } finally {
                loading.classList.add('hidden');
            }
        }

        function render(scripts) {
            scriptGrid.innerHTML = scripts.map(s => `
                <div class="reth-card p-4">
                    <div class="aspect-video bg-zinc-900 rounded-lg mb-3 overflow-hidden">
                        <img src="${s.game.imageUrl}" class="w-full h-full object-cover opacity-60" onerror="this.src='https://via.placeholder.com/300x150/000/fff?text=RETH'">
                    </div>
                    <h3 class="text-[11px] font-black uppercase truncate mb-1">${s.title}</h3>
                    <p class="text-[9px] text-zinc-600 font-bold uppercase truncate mb-4">${s.game.name}</p>
                    <a href="https://scriptblox.com/script/${s.slug}" target="_blank" class="mt-auto bg-white text-black text-center py-2.5 rounded-lg text-[9px] font-black uppercase hover:bg-zinc-300 transition">GET SCRIPT</a>
                </div>
            `).join('');
        }

        let timer;
        searchInput.addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(() => fetchScripts(searchInput.value), 600);
        });

        fetchScripts(""); // Load initial
    </script>
</body>
</html>
