<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETH OFFICIAL — SCRIPT HUB</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* การตั้งค่าพื้นฐาน */
        body { 
            background-color: #000000; 
            color: #ffffff; 
            font-family: 'Inter', sans-serif; 
            margin: 0px; 
            -webkit-font-smoothing: antialiased; 
        }

        /* ปุ่ม Discord มุมขวาบน */
        .discord-button-top { 
            position: fixed; 
            top: 25px; 
            right: 25px; 
            background-color: #5865F2; 
            color: #ffffff; 
            padding: 12px 24px; 
            border-radius: 12px; 
            font-size: 11px; 
            font-weight: 900; 
            text-transform: uppercase; 
            z-index: 100; 
            text-decoration: none; 
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5); 
        }

        /* ช่องค้นหา */
        .search-field { 
            background-color: #050505; 
            border: 1px solid #111111; 
            border-radius: 20px; 
            color: #ffffff; 
            font-size: 13px; 
            font-weight: 700; 
            text-transform: uppercase; 
            width: 100%; 
            padding: 22px 30px; 
            outline: none; 
        }

        /* การ์ดสคริปต์ */
        .script-card { 
            background-color: #050505; 
            border: 1px solid #111111; 
            border-radius: 24px; 
            padding: 24px; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            cursor: pointer; 
            transition: 0.2s ease;
        }
        .script-card:hover {
            border-color: #333333;
            transform: translateY(-5px);
        }

        /* ส่วนแสดงรูปภาพ */
        .image-container { 
            position: relative; 
            aspect-ratio: 16 / 9; 
            border-radius: 16px; 
            overflow: hidden; 
            margin-bottom: 15px; 
            background-color: #000000; 
        }
        .image-display { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            opacity: 1; 
        }

        /* ป้าย Key/Keyless */
        .key-badge { 
            position: absolute; 
            top: 12px; 
            left: 12px;
            font-size: 9px; 
            font-weight: 900; 
            text-transform: uppercase; 
            padding: 5px 12px; 
            border-radius: 6px; 
            z-index: 10; 
        }
        .key-badge-green { background-color: #15803d; color: #ffffff; } 
        .key-badge-yellow { background-color: #a16207; color: #ffffff; }
        
        /* 🔥 ปรับแต่งสถานะ Working ให้เป็น Liquid Glass */
        .status-glass-overlay { 
            position: absolute; 
            top: 12px; 
            right: 12px; 
            font-size: 11px; 
            font-weight: 900; 
            text-transform: uppercase; 
            
            /* คุณสมบัติ Liquid Glass */
            background-color: rgba(255, 255, 255, 0.05); /* พื้นหลังขาวจางมากๆ */
            backdrop-filter: blur(10px);               /* เอฟเฟกต์กระจกฝ้า */
            -webkit-backdrop-filter: blur(10px);        /* สำหรับ Safari */
            border: 1px solid rgba(255, 255, 255, 0.1); /* ขอบกระจกบางๆ */
            
            padding: 6px 12px; 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        /* จุดไฟสถานะภายในกระจก */
        .status-light-dot { 
            width: 7px; 
            height: 7px; 
            border-radius: 50%; 
        }
        .light-green { background-color: #22c55e; box-shadow: 0px 0px 10px #22c55e; }
        .light-red { background-color: #ef4444; box-shadow: 0px 0px 10px #ef4444; }

        /* สถิติตัวเลข */
        .stats-display-row { 
            display: flex; 
            gap: 12px; 
            margin-bottom: 15px; 
            font-size: 10px; 
            font-weight: 800; 
            color: #666666; 
        }
        .color-like { color: #4ade80; }
        .color-dislike { color: #f87171; }

        /* ปุ่ม COPY */
        .button-copy-action { 
            background-color: #ffffff; 
            color: #000000; 
            text-align: center; 
            padding: 14px; 
            border-radius: 12px; 
            font-size: 11px; 
            font-weight: 900; 
            text-transform: uppercase; 
            margin-bottom: 15px; 
            cursor: pointer; 
        }

        .main-script-title { font-size: 15px; font-weight: 900; text-transform: uppercase; color: #ffffff; line-height: 1.2; margin-bottom: 4px; }
        .sub-game-title { font-size: 9px; font-weight: 700; color: #444444; text-transform: uppercase; }
    </style>
</head>
<body class="p-6 md:p-16">

    <a href="https://discord.gg/Yp2bXVvU9B" target="_blank" class="discord-button-top">DISCORD</a>

    <div class="max-w-7xl mx-auto">
        <header class="py-16 text-center">
            <h1 class="text-[80px] font-black italic uppercase leading-none tracking-tighter">RETH</h1>
            <p class="text-[10px] font-bold text-zinc-700 tracking-[0.5em] mt-2 uppercase">OFFICIAL SCRIPT HUB</p>
        </header>

        <div class="max-w-2xl mx-auto mb-16">
            <input type="text" id="scriptSearchInput" placeholder="SEARCH SCRIPTS..." class="search-field">
        </div>

        <div id="scriptContainerGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            </div>
    </div>

    <div id="fullDetailModal" class="fixed inset-0 bg-black/98 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="bg-[#080808] border border-[#1a1a1a] rounded-[24px] max-w-[600px] w-[95%] p-10 relative">
            <button onclick="hideModalNow()" class="absolute top-6 right-8 text-zinc-600 font-bold text-[10px] uppercase">Close [X]</button>
            <h2 id="modalHeaderTitle" class="text-2xl font-black uppercase italic mb-1"></h2>
            <div id="modalStatsInfo" class="stats-display-row mb-4"></div>
            <p id="modalGameInfo" class="text-[10px] text-zinc-600 font-bold uppercase mb-8"></p>
            <div class="flex gap-3 mb-6">
                <div onclick="copyScriptCode()" id="modalCopyBtn" class="button-copy-action flex-1 mb-0">COPY SCRIPT</div>
                <a href="#" id="modalWebLink" target="_blank" class="border border-zinc-800 text-white text-[10px] font-black uppercase rounded-[12px] flex items-center justify-center px-8">VIEW WEB</a>
            </div>
            <div id="modalContentBox" class="bg-black border border-[#111111] rounded-[12px] p-5 font-mono text-[12px] text-[#555] whitespace-pre-wrap max-h-[250px] overflow-y-auto"></div>
        </div>
    </div>

    <script>
        var containerGrid = document.getElementById('scriptContainerGrid');
        var modalWrapper = document.getElementById('fullDetailModal');
        var scriptsArray = [];

        // ฟังก์ชันดึงข้อมูลแบบเขียนเต็ม
        async function startFetchingScripts(searchValue) {
            var finalUrl = "";
            if (searchValue) {
                finalUrl = "https://scriptblox.com/api/script/search?q=" + encodeURIComponent(searchValue) + "&max=50";
            } else {
                finalUrl = "https://scriptblox.com/api/script/fetch?page=1&max=50";
            }

            var proxyServer = "https://api.codetabs.com/v1/proxy/?quest=" + encodeURIComponent(finalUrl);

            try {
                var responseData = await fetch(proxyServer);
                var resultObject = await responseData.json();
                
                if (resultObject.result.scripts) {
                    scriptsArray = resultObject.result.scripts;
                } else {
                    scriptsArray = resultObject.result.docs;
                }
                
                buildScriptCards(scriptsArray);
            } catch (err) {
                console.log("Error loading scripts.");
            }
        }

        // ฟังก์ชันสร้างการ์ด HTML แบบไม่ใช้ตัวย่อ
        function buildScriptCards(dataList) {
            var finalHtml = "";
            
            for (var index = 0; index < dataList.length; index++) {
                var currentItem = dataList[index];
                var currentImage = "";
                
                if (currentItem.image && !currentItem.image.includes('http')) {
                    currentImage = "https://scriptblox.com" + currentItem.image;
                } else {
                    currentImage = currentItem.game.imageUrl || 'https://via.placeholder.com/400x225/050505/222?text=RETH+HUB';
                }

                finalHtml += '<div class="script-card" onclick="showScriptModal(' + index + ')">';
                finalHtml += '    <div class="image-container">';
                
                // ป้าย Key
                if (currentItem.key === true) {
                    finalHtml += '    <div class="key-badge key-badge-yellow">KEY</div>';
                } else {
                    finalHtml += '    <div class="key-badge key-badge-green">KEYLESS</div>';
                }

                // 🔥 ป้ายสถานะแบบ Liquid Glass
                finalHtml += '        <div class="status-glass-overlay">';
                if (currentItem.isPatched === true) {
                    finalHtml += '        <span class="status-light-dot light-red"></span> Patched';
                } else {
                    finalHtml += '        <span class="status-light-dot light-green"></span> Working';
                }
                finalHtml += '        </div>';
                
                finalHtml += '        <img src="' + currentImage + '" class="image-display">';
                finalHtml += '    </div>';

                finalHtml += '    <div class="stats-display-row">';
                finalHtml += '        <span>👁 ' + currentItem.views.toLocaleString() + '</span>';
                finalHtml += '        <span class="color-like">👍 ' + currentItem.likeCount.toLocaleString() + '</span>';
                finalHtml += '        <span class="color-dislike">👎 ' + currentItem.dislikeCount.toLocaleString() + '</span>';
                finalHtml += '    </div>';

                finalHtml += '    <div class="button-copy-action" onclick="event.stopPropagation(); copyDirectLoadstring(' + index + ', this)">COPY LOADSTRING</div>';

                finalHtml += '    <div class="flex-grow">';
                finalHtml += '        <h3 class="main-script-title truncate">' + currentItem.title + '</h3>';
                finalHtml += '        <p class="sub-game-title truncate">' + (currentItem.game ? currentItem.game.name : "UNIVERSAL") + '</p>';
                finalHtml += '    </div>';
                finalHtml += '</div>';
            }

            containerGrid.innerHTML = finalHtml;
        }

        function showScriptModal(id) {
            var data = scriptsArray[id];
            document.getElementById('modalHeaderTitle').innerText = data.title;
            document.getElementById('modalContentBox').innerText = data.script;
            document.getElementById('modalWebLink').href = "https://scriptblox.com/script/" + data.slug;
            document.getElementById('modalGameInfo').innerText = data.game ? data.game.name : "UNIVERSAL";
            document.getElementById('modalStatsInfo').innerHTML = 
                '<span>👁 ' + data.views.toLocaleString() + ' VIEWS</span>' +
                '<span class="color-like">👍 ' + data.likeCount.toLocaleString() + ' LIKES</span>' +
                '<span class="color-dislike">👎 ' + data.dislikeCount.toLocaleString() + ' DISLIKES</span>';

            modalWrapper.classList.remove('hidden');
            setTimeout(function() { modalWrapper.classList.add('opacity-100'); }, 10);
            document.body.style.overflow = 'hidden';
        }

        function hideModalNow() {
            modalWrapper.classList.remove('opacity-100');
            setTimeout(function() { modalWrapper.classList.add('hidden'); document.body.style.overflow = 'auto'; }, 300);
        }

        function copyDirectLoadstring(id, btn) {
            var code = scriptsArray[id].script;
            navigator.clipboard.writeText(code).then(function() {
                var oldText = btn.innerText;
                btn.innerText = "COPIED!"; btn.style.backgroundColor = "#22c55e"; btn.style.color = "#fff";
                setTimeout(function() {
                    btn.innerText = oldText; btn.style.backgroundColor = "#fff"; btn.style.color = "#000";
                }, 1500);
            });
        }

        function copyScriptCode() {
            var code = document.getElementById('modalContentBox').innerText;
            var btn = document.getElementById('modalCopyBtn');
            navigator.clipboard.writeText(code).then(function() {
                btn.innerText = "COPIED!"; btn.style.backgroundColor = "#22c55e"; btn.style.color = "#fff";
                setTimeout(function() {
                    btn.innerText = "COPY SCRIPT"; btn.style.backgroundColor = "#fff"; btn.style.color = "#000";
                }, 1500);
            });
        }

        var typingDelay;
        document.getElementById('scriptSearchInput').addEventListener('input', function(e) {
            clearTimeout(typingDelay);
            typingDelay = setTimeout(function() {
                startFetchingScripts(e.target.value);
            }, 500);
        });

        window.onload = function() {
            startFetchingScripts("");
        };
    </script>
</body>
</html>
