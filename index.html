<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETH OFFICIAL — SCRIPT HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000000; color: #ffffff; font-family: 'Inter', sans-serif; margin: 0; -webkit-font-smoothing: antialiased; }
        
        .discord-btn { position: fixed; top: 25px; right: 25px; background: #5865F2; color: white; padding: 12px 24px; border-radius: 12px; font-size: 11px; font-weight: 900; text-transform: uppercase; z-index: 100; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

        .reth-search { background: #050505; border: 1px solid #111; border-radius: 20px; color: #ffffff; font-size: 13px; font-weight: 700; text-transform: uppercase; width: 100%; padding: 22px 30px; outline: none; }

        /* Card - ปรับกลับมาให้ทึบและชัดเจน */
        .reth-card { background: #050505; border: 1px solid #111; border-radius: 24px; padding: 24px; transition: 0.2s; height: 100%; display: flex; flex-direction: column; cursor: pointer; }
        .reth-card:hover { border-color: #333; background: #080808; }

        /* Image - เอา Opacity ออกเพื่อให้ภาพชัด 100% */
        .thumb-container { position: relative; aspect-ratio: 16/9; border-radius: 16px; overflow: hidden; margin-bottom: 15px; background: #000; }
        .thumb-img { width: 100%; height: 100%; object-fit: cover; opacity: 1 !important; } /* ชัดเจน 100% */

        /* Tags - ปรับสีให้ทึบ ไม่โปร่งแสง */
        .tag-common { position: absolute; top: 12px; font-size: 9px; font-weight: 900; text-transform: uppercase; padding: 5px 12px; border-radius: 6px; z-index: 10; }
        .tag-keyless { left: 12px; background: #15803d; color: #fff; } 
        .tag-key { left: 12px; background: #a16207; color: #fff; }
        
        /* Working Status - ปรับให้เด่นชัดบนรูป */
        .tag-status { position: absolute; top: 12px; right: 12px; font-size: 11px; font-weight: 900; text-transform: uppercase; background: rgba(0,0,0,0.8); padding: 4px 10px; border-radius: 6px; display: flex; align-items: center; gap: 6px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; }
        .dot-working { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .dot-patched { background: #ef4444; box-shadow: 0 0 8px #ef4444; }

        /* Stats & Buttons */
        .stats-row { display: flex; gap: 12px; margin-bottom: 15px; font-size: 10px; font-weight: 800; color: #666; }
        .stat-like { color: #4ade80; }
        .stat-dislike { color: #f87171; }

        .btn-copy { background: #ffffff; color: #000; text-align: center; padding: 14px; border-radius: 12px; font-size: 11px; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; cursor: pointer; }
        
        .script-title { font-size: 15px; font-weight: 900; text-transform: uppercase; color: #fff; line-height: 1.2; margin-bottom: 4px; }
        .game-title { font-size: 9px; font-weight: 700; color: #444; text-transform: uppercase; letter-spacing: 0.1em; }

        /* Modal */
        .modal-content { background: #080808; border: 1px solid #1a1a1a; border-radius: 24px; max-width: 600px; width: 95%; padding: 40px; position: relative; }
        .script-box { background: #000; border: 1px solid #111; border-radius: 12px; padding: 20px; font-family: monospace; font-size: 12px; color: #555; white-space: pre-wrap; margin-top: 20px; }
    </style>
</head>
<body class="p-6 md:p-16">

    <a href="https://discord.gg/Yp2bXVvU9B" target="_blank" class="discord-btn">DISCORD</a>

    <div class="max-w-7xl mx-auto">
        <header class="py-16 text-center">
            <h1 class="text-[80px] font-black italic uppercase leading-none tracking-tighter">RETH</h1>
            <p class="text-[10px] font-bold text-zinc-700 tracking-[0.5em] mt-2 uppercase">OFFICIAL SCRIPT HUB</p>
        </header>

        <div class="max-w-2xl mx-auto mb-16">
            <input type="text" id="searchInput" placeholder="SEARCH SCRIPTS..." class="reth-search">
        </div>

        <div id="scriptGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </div>

    <div id="scriptModal" class="fixed inset-0 bg-black/98 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="modal-content">
            <button onclick="closeModal()" class="absolute top-6 right-8 text-zinc-600 font-bold text-[10px] uppercase">Close [X]</button>
            <h2 id="modalTitle" class="text-2xl font-black uppercase italic mb-1"></h2>
            <div id="modalStats" class="stats-row mb-4"></div>
            <p id="modalGame" class="text-[10px] text-zinc-600 font-bold uppercase mb-8"></p>
            
            <div class="flex gap-3 mb-6">
                <div onclick="copyFromModal()" id="modalCopyBtn" class="btn-copy flex-1 mb-0">COPY SCRIPT</div>
                <a href="#" id="modalWebBtn" target="_blank" class="border border-zinc-800 text-white text-[10px] font-black uppercase rounded-12 flex items-center justify-center px-8">VIEW WEB</a>
            </div>
            <div id="modalScript" class="script-box max-h-[250px]"></div>
        </div>
    </div>

    <script>
        const scriptGrid = document.getElementById('scriptGrid');
        const modal = document.getElementById('scriptModal');
        let scriptsData = [];

        async function fetchScripts(query = "") {
            const url = query 
                ? `https://scriptblox.com/api/script/search?q=${encodeURIComponent(query)}&max=50`
                : `https://scriptblox.com/api/script/fetch?page=1&max=50`; 
            const proxy = `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`;
            try {
                const res = await fetch(proxy);
                const data = await res.json();
                scriptsData = data.result.scripts || data.result.docs || [];
                render(scriptsData);
            } catch (e) { console.error("API Error"); }
        }

        const formatNum = (n) => (n || 0).toLocaleString();

        function render(scripts) {
            scriptGrid.innerHTML = scripts.map((s, i) => {
                const thumb = s.image && !s.image.includes('http') ? `https://scriptblox.com${s.image}` : (s.game.imageUrl || '');
                return `
                <div class="reth-card" onclick="openModal(${i})">
                    <div class="thumb-container">
                        <div class="tag-common ${s.key ? 'tag-key' : 'tag-keyless'}">${s.key ? 'KEY' : 'KEYLESS'}</div>
                        <div class="tag-status">
                            <span class="dot ${s.isPatched ? 'dot-patched' : 'dot-working'}"></span>
                            ${s.isPatched ? 'Patched' : 'Working'}
                        </div>
                        <img src="${thumb}" class="thumb-img" onerror="this.src='https://via.placeholder.com/400x225/050505/222?text=RETH+HUB'">
                    </div>

                    <div class="stats-row">
                        <span>👁 ${formatNum(s.views)}</span>
                        <span class="stat-like">👍 ${formatNum(s.likeCount)}</span>
                        <span class="stat-dislike">👎 ${formatNum(s.dislikeCount)}</span>
                    </div>

                    <div class="btn-copy" onclick="event.stopPropagation(); copyIdx(${i}, this)">COPY LOADSTRING</div>

                    <div class="flex-grow">
                        <h3 class="script-title truncate">${s.title}</h3>
                        <p class="game-title truncate">${s.game ? s.game.name : 'UNIVERSAL'}</p>
                    </div>
                </div>`;
            }).join('');
        }

        function openModal(i) {
            const s = scriptsData[i];
            document.getElementById('modalTitle').innerText = s.title;
            document.getElementById('modalGame').innerText = s.game ? s.game.name : 'UNIVERSAL';
            document.getElementById('modalScript').innerText = s.script;
            document.getElementById('modalWebBtn').href = `https://scriptblox.com/script/${s.slug}`;
            document.getElementById('modalStats').innerHTML = `
                <span>👁 ${formatNum(s.views)} VIEWS</span>
                <span class="stat-like">👍 ${formatNum(s.likeCount)} LIKES</span>
                <span class="stat-dislike">👎 ${formatNum(s.dislikeCount)} DISLIKES</span>
            `;
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('opacity-100'), 10);
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('opacity-100');
            setTimeout(() => { modal.classList.add('hidden'); document.body.style.overflow = 'auto'; }, 300);
        }

        function copyIdx(i, btn) {
            navigator.clipboard.writeText(scriptsData[i].script).then(() => {
                btn.innerText = "COPIED!"; btn.style.background = "#22c55e"; btn.style.color = "#fff";
                setTimeout(() => { btn.innerText = "COPY LOADSTRING"; btn.style.background = "#fff"; btn.style.color = "#000"; }, 1500);
            });
        }

        function copyFromModal() {
            navigator.clipboard.writeText(document.getElementById('modalScript').innerText).then(() => {
                const btn = document.getElementById('modalCopyBtn');
                btn.innerText = "COPIED!"; btn.style.background = "#22c55e"; btn.style.color = "#fff";
                setTimeout(() => { btn.innerText = "COPY SCRIPT"; btn.style.background = "#fff"; btn.style.color = "#000"; }, 1500);
            });
        }

        let t;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(t);
            t = setTimeout(() => fetchScripts(e.target.value), 500);
        });

        window.onload = () => fetchScripts("");
    </script>
</body>
</html>
