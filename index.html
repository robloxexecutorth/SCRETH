<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETH — SCRIPT SEARCH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap');
        
        body { 
            background-color: #000000; 
            color: #ffffff; 
            font-family: 'Inter', sans-serif;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* RETH Card Style */
        .reth-card {
            background: #080808;
            border: 1px solid #111;
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .reth-card:hover {
            border-color: #444;
            transform: translateY(-5px);
            background: #0c0c0c;
            box-shadow: 0 10px 30px -10px rgba(255,255,255,0.1);
        }

        /* Search Input Style */
        .search-box {
            background: #080808;
            border: 1px solid #111;
            border-radius: 18px;
            outline: none;
            transition: 0.3s;
        }
        .search-box:focus {
            border-color: #ffffff;
            background: #0c0c0c;
        }

        /* Custom Loader */
        .loader {
            width: 24px;
            height: 24px;
            border: 3px solid #1a1a1a;
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ปรับแต่ง Scrollbar ให้ดูดาร์ก */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #333; }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-7xl mx-auto">
        <header class="py-10 md:py-16">
            <h1 class="text-6xl md:text-8xl font-[900] italic tracking-tighter uppercase leading-none">RETH SCRIPTS</h1>
            <div class="flex items-center gap-3 mt-2">
                <div class="h-[1px] w-12 bg-zinc-800"></div>
                <p class="text-[10px] text-zinc-500 font-bold tracking-[0.5em] uppercase">Search Global Library</p>
            </div>
        </header>

        <div class="relative mb-16 max-w-3xl">
            <input type="text" id="searchInput" 
                   placeholder="SEARCH SCRIPTS (E.G. BLOX FRUITS)..." 
                   class="search-box w-full p-6 text-xs font-black tracking-[0.2em] uppercase">
            <div id="loading" class="hidden absolute right-6 top-6">
                <div class="loader"></div>
            </div>
        </div>

        <div id="scriptGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            </div>
    </div>

    <script>
        const scriptGrid = document.getElementById('scriptGrid');
        const searchInput = document.getElementById('searchInput');
        const loading = document.getElementById('loading');

        // ฟังก์ชันหลักในการดึงข้อมูล (ใช้ Multi-Proxy ป้องกันการโหลดนาน)
        async function fetchScripts(query = "") {
            loading.classList.remove('hidden');
            scriptGrid.style.opacity = "0.4"; // แสดงสถานะว่ากำลังโหลด

            const target = `https://scriptblox.com/api/script/search?q=${encodeURIComponent(query)}&max=24`;
            
            // รายชื่อ Proxy ที่จะลอง (เรียงตามความเร็ว)
            const proxyList = [
                `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(target)}`,
                `https://corsproxy.io/?${encodeURIComponent(target)}`,
                `https://api.allorigins.win/get?url=${encodeURIComponent(target)}`
            ];

            let success = false;

            for (const url of proxyList) {
                if (success) break;
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error("Proxy error");

                    let data;
                    // AllOrigins ต้อง parse contents อีกรอบ
                    if (url.includes("allorigins")) {
                        const json = await response.json();
                        data = JSON.parse(json.contents);
                    } else {
                        data = await response.json();
                    }

                    if (data && data.result && data.result.scripts) {
                        renderScripts(data.result.scripts);
                        success = true;
                    }
                } catch (err) {
                    console.warn(`Proxy ${url} failed, trying next...`);
                }
            }

            if (!success) {
                scriptGrid.innerHTML = `
                    <div class="col-span-full py-20 text-center">
                        <p class="text-red-500 font-black uppercase text-[10px] tracking-widest">Connection Error: All proxies are busy.</p>
                        <button onclick="location.reload()" class="mt-4 text-white border border-white/20 px-6 py-2 rounded-full text-[10px] font-bold uppercase hover:bg-white hover:text-black transition">Try Again</button>
                    </div>
                `;
            }

            loading.classList.add('hidden');
            scriptGrid.style.opacity = "1";
        }

        // ฟังก์ชันสร้าง Card สคริปต์
        function renderScripts(scripts) {
            if (!scripts || scripts.length === 0) {
                scriptGrid.innerHTML = '<p class="col-span-full text-center text-zinc-600 font-bold uppercase text-[10px] tracking-widest py-20">No scripts found for this search.</p>';
                return;
            }

            scriptGrid.innerHTML = scripts.map(s => `
                <div class="reth-card p-5">
                    <div class="relative aspect-video bg-zinc-900 rounded-2xl mb-4 overflow-hidden group">
                        <img src="${s.game.imageUrl}" 
                             class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition duration-500" 
                             onerror="this.src='https://via.placeholder.com/400x225/080808/333333?text=RETH+OFFICIAL'">
                        <div class="absolute top-3 right-3 px-2 py-1 bg-black/80 backdrop-blur-md rounded-lg border border-white/10">
                             <p class="text-[8px] font-black uppercase tracking-tighter">${s.isPatched ? '🔴 Patched' : '🟢 Working'}</p>
                        </div>
                    </div>
                    
                    <div class="mb-6">
                        <h3 class="text-sm font-black uppercase tracking-tight truncate">${s.title}</h3>
                        <p class="text-[9px] text-zinc-500 font-bold uppercase mt-1 truncate">${s.game.name}</p>
                    </div>

                    <div class="mt-auto flex flex-col gap-2">
                        <a href="https://scriptblox.com/script/${s.slug}" target="_blank" 
                           class="bg-white text-black text-center py-3 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-zinc-200 transition active:scale-95">
                           GET SCRIPT
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // ระบบ Search แบบ Debounce (หน่วงเวลาพิมพ์ 0.4 วินาทีเพื่อลดภาระ API)
        let typingTimer;
        searchInput.addEventListener('input', () => {
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                fetchScripts(searchInput.value);
            }, 400);
        });

        // โหลดข้อมูลครั้งแรกทันทีที่เปิดหน้าเว็บ
        fetchScripts("");
    </script>
</body>
</html>
