<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETH OFFICIAL — SCRIPT HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background-color: #000000; color: #ffffff; font-family: 'Inter', sans-serif; margin: 0; -webkit-font-smoothing: antialiased; }
        .reth-title { font-size: 80px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -0.05em; line-height: 1; }
        @media (max-width: 768px) { .reth-title { font-size: 50px; } }
        .reth-title-underline { height: 2px; width: 100px; background-color: #2a2a2a; margin-top: -10px; }
        .reth-subtitle { font-size: 10px; font-weight: 700; color: #555555; text-transform: uppercase; letter-spacing: 0.5em; margin-top: 15px; }
        
        .reth-card { background: #050505; border: 1px solid #111111; border-radius: 20px; transition: all 0.2s ease-in-out; height: 100%; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .reth-card:hover { border-color: #333333; transform: translateY(-3px); }
        
        .status-badge { background-color: #0c0c0c; border: 1px solid #1a1a1a; border-radius: 8px; padding: 4px 10px; font-size: 9px; font-weight: 700; text-transform: uppercase; display: flex; align-items: center; gap: 5px; }
        .status-dot { height: 6px; width: 6px; border-radius: 50%; }
        .status-dot.working { background-color: #22c55e; }
        .status-dot.patched { background-color: #ef4444; }
        
        /* ปุ่ม Copy ใหม่ - ตำแหน่งกดง่ายขึ้น */
        .btn-copy-main { 
            background-color: #ffffff; 
            color: #000000; 
            text-align: center; 
            padding: 12px 0; 
            border-radius: 12px; 
            font-size: 11px; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 0.1em; 
            transition: 0.2s; 
            cursor: pointer; 
            margin-bottom: 12px;
        }
        .btn-copy-main:hover { background-color: #e5e5e5; transform: scale(1.02); }
        .btn-copy-main:active { transform: scale(0.98); }

        .reth-search { background: #050505; border: 1px solid #111111; border-radius: 15px; color: #ffffff; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.2em; width: 100%; padding: 24px; outline: none; }
        .reth-search:focus { border-color: #ffffff; }
        
        .loader { width: 20px; height: 20px; border: 2px solid #111111; border-top: 2px solid #ffffff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-6 md:p-16">

    <div class="max-w-7xl mx-auto">
        <header class="py-16 md:py-20 text-center flex flex-col items-center">
            <h1 class="reth-title">RETH</h1>
            <div class="reth-title-underline"></div>
            <p class="reth-subtitle">OFFICIAL SCRIPT HUB</p>
        </header>

        <div class="relative mb-20 max-w-2xl mx-auto">
            <input type="text" id="searchInput" placeholder="SEARCH SCRIPTS..." class="reth-search">
            <div id="loading" class="hidden absolute right-6 top-6"><div class="loader"></div></div>
        </div>

        <div id="scriptGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </div>

    <script>
        const scriptGrid = document.getElementById('scriptGrid');
        const searchInput = document.getElementById('searchInput');
        const loading = document.getElementById('loading');
        let scriptsData = [];

        async function fetchScripts(query = "") {
            loading.classList.remove('hidden');
            const target = `https://scriptblox.com/api/script/search?q=${encodeURIComponent(query)}&max=24`;
            const proxy = `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(target)}`;

            try {
                const response = await fetch(proxy);
                const data = await response.json();
                if (data && data.result) {
                    scriptsData = data.result.scripts;
                    renderScripts(scriptsData);
                }
            } catch (err) {
                scriptGrid.innerHTML = '<p class="col-span-full text-center text-red-500 font-bold text-[10px]">FAILED TO LOAD. TRY REFRESHING.</p>';
            } finally {
                loading.classList.add('hidden');
            }
        }

        function renderScripts(scripts) {
            if (!scripts || scripts.length === 0) {
                scriptGrid.innerHTML = '<p class="col-span-full text-center text-zinc-600 font-bold text-[10px]">NO SCRIPTS FOUND.</p>';
                return;
            }

            const placeholderImg = "https://via.placeholder.com/400x225/050505/222222?text=RETH+OFFICIAL";

            scriptGrid.innerHTML = scripts.map((s, index) => `
                <div class="reth-card p-5 group">
                    <button onclick="copyByIndex(${index}, this)" 
                            class="absolute top-7 right-7 p-2.5 bg-black/90 border border-white/20 rounded-lg text-zinc-400 hover:text-white transition-all z-10 opacity-100 md:opacity-0 md:group-hover:opacity-100">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2" />
                        </svg>
                    </button>

                    <div class="relative aspect-video bg-zinc-950 rounded-xl mb-4 overflow-hidden">
                        <img src="${s.game.imageUrl || placeholderImg}" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition duration-500" onerror="this.src='${placeholderImg}'">
                        <div class="absolute top-3 right-3 status-badge backdrop-blur-sm">
                            <span class="status-dot ${s.isPatched ? 'patched' : 'working'}"></span>
                            ${s.isPatched ? 'Patched' : 'Working'}
                        </div>
                    </div>

                    <div onclick="copyByIndex(${index}, this)" class="btn-copy-main">COPY LOADSTRING</div>

                    <div class="flex-grow">
                        <h3 class="text-sm font-black uppercase truncate mb-1">${s.title}</h3>
                        <p class="text-[9px] text-zinc-600 font-bold uppercase truncate">${s.game.name}</p>
                    </div>
                </div>
            `).join('');
        }

        function copyByIndex(index, btn) {
            const scriptText = scriptsData[index].script;
            if (!scriptText) return;

            navigator.clipboard.writeText(scriptText).then(() => {
                const isIcon = btn.tagName === 'BUTTON';
                if (isIcon) {
                    const originalColor = btn.style.color;
                    btn.style.color = "#22c55e";
                    setTimeout(() => btn.style.color = originalColor, 1500);
                } else {
                    const originalText = btn.innerText;
                    btn.innerText = "COPIED!";
                    btn.style.backgroundColor = "#22c55e";
                    btn.style.color = "#ffffff";
                    setTimeout(() => {
                        btn.innerText = originalText;
                        btn.style.backgroundColor = "#ffffff";
                        btn.style.color = "#000000";
                    }, 1500);
                }
            }).catch(() => {
                // Fallback สำหรับเครื่องที่บล็อก Clipboard API
                const t = document.createElement("textarea");
                t.value = scriptText;
                document.body.appendChild(t);
                t.select();
                document.execCommand('copy');
                document.body.removeChild(t);
                if (btn.tagName !== 'BUTTON') {
                    btn.innerText = "COPIED!";
                    setTimeout(() => { btn.innerText = "COPY LOADSTRING"; }, 1500);
                }
            });
        }

        let typingTimer;
        searchInput.addEventListener('input', () => {
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => fetchScripts(searchInput.value), 400);
        });

        fetchScripts("");
    </script>
</body>
</html>
