<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETH OFFICIAL — SCRIPT HUB</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* Base Styling */
        body { 
            background-color: #000000; 
            color: #ffffff; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            -webkit-font-smoothing: antialiased; 
            overflow-x: hidden; 
        }

        /* Discord Button Styling (Top Right) */
        .discord-btn { 
            position: fixed; 
            top: 25px; 
            right: 25px; 
            background: #5865F2; 
            color: white; 
            padding: 12px 24px; 
            border-radius: 14px; 
            font-size: 11px; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 0.1em; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 100; 
            text-decoration: none; 
            box-shadow: 0 4px 20px rgba(88, 101, 242, 0.4); 
        }
        .discord-btn:hover { 
            background: #4752c4; 
            transform: translateY(-3px) scale(1.05); 
        }

        /* Header Styling */
        .reth-title { 
            font-size: 85px; 
            font-weight: 900; 
            font-style: italic; 
            text-transform: uppercase; 
            letter-spacing: -0.05em; 
            line-height: 1; 
        }
        .reth-title-underline { 
            height: 2px; 
            width: 120px; 
            background-color: #2a2a2a; 
            margin-top: -10px; 
        }
        .reth-subtitle { 
            font-size: 10px; 
            font-weight: 700; 
            color: #555555; 
            text-transform: uppercase; 
            letter-spacing: 0.5em; 
            margin-top: 15px; 
        }
        .powered-by { 
            font-size: 9px; 
            font-weight: 800; 
            color: #333333; 
            text-transform: uppercase; 
            letter-spacing: 0.2em; 
            margin-top: 30px; 
        }

        /* Search Input */
        .search-container {
            max-width: 600px;
            margin: 0 auto 60px auto;
        }
        .reth-search { 
            background: #050505; 
            border: 1px solid #111111; 
            border-radius: 20px; 
            color: #ffffff; 
            font-size: 13px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.2em; 
            width: 100%; 
            padding: 26px; 
            outline: none; 
            transition: border-color 0.3s;
        }
        .reth-search:focus {
            border-color: #333333;
        }

        /* Script Card Styling */
        .reth-card { 
            background: #050505; 
            border: 1px solid #111111; 
            border-radius: 24px; 
            transition: all 0.3s ease; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            position: relative; 
            cursor: pointer; 
        }
        .reth-card:hover { 
            border-color: #333333; 
            transform: translateY(-5px); 
            background: #080808;
        }
        
        /* Badges & Tags */
        .key-tag { 
            position: absolute; 
            top: 15px; 
            left: 15px; 
            font-size: 8px; 
            font-weight: 900; 
            text-transform: uppercase; 
            padding: 5px 10px; 
            border-radius: 8px; 
            letter-spacing: 0.05em; 
            backdrop-filter: blur(8px); 
            z-index: 10; 
        }
        .key-required { 
            background-color: rgba(234, 179, 8, 0.15); 
            color: #facc15; 
            border: 1px solid rgba(234, 179, 8, 0.3); 
        }
        .keyless { 
            background-color: rgba(34, 197, 94, 0.15); 
            color: #4ade80; 
            border: 1px solid rgba(34, 197, 94, 0.3); 
        }
        
        .status-badge { 
            background-color: rgba(0, 0, 0, 0.6); 
            border: 1px solid #1a1a1a; 
            border-radius: 8px; 
            padding: 5px 12px; 
            font-size: 9px; 
            font-weight: 700; 
            text-transform: uppercase; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            backdrop-filter: blur(4px);
        }
        .status-dot { height: 6px; width: 6px; border-radius: 50%; }
        .status-dot.working { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .status-dot.patched { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }

        /* Stats & Info */
        .stats-row { 
            display: flex; 
            gap: 15px; 
            font-size: 10px; 
            font-weight: 800; 
            color: #555555; 
            margin-bottom: 12px; 
            text-transform: uppercase; 
        }
        .stat-view { color: #888888; }
        .stat-like { color: #4ade80; }
        .stat-dislike { color: #f87171; }

        .btn-copy-main { 
            background-color: #ffffff; 
            color: #000000; 
            text-align: center; 
            padding: 14px 0; 
            border-radius: 14px; 
            font-size: 11px; 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: 0.1em; 
            transition: 0.2s; 
            cursor: pointer; 
            margin-bottom: 15px;
        }
        .btn-copy-main:hover { background-color: #e5e5e5; }

        /* Modal UI */
        #scriptModal { transition: opacity 0.3s ease; }
        .modal-content { 
            background: #080808; 
            border: 1px solid #1a1a1a; 
            border-radius: 30px; 
            max-width: 650px; 
            width: 95%; 
            max-height: 85vh; 
            overflow-y: auto; 
            padding: 40px;
        }
        .script-box { 
            background: #000000; 
            border: 1px solid #111111; 
            border-radius: 16px; 
            padding: 20px; 
            font-family: 'Courier New', monospace; 
            font-size: 13px; 
            color: #777777; 
            white-space: pre-wrap; 
            word-break: break-all; 
            margin-top: 20px; 
        }
    </style>
</head>
<body class="p-6 md:p-16">

    <a href="https://discord.gg/Yp2bXVvU9B" target="_blank" class="discord-btn">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M13.545 2.907a13.227 13.227 0 0 0-3.257-1.011.05.05 0 0 0-.052.025c-.141.25-.297.577-.406.833a12.19 12.19 0 0 0-3.658 0 8.258 8.258 0 0 0-.412-.833.051.051 0 0 0-.052-.025c-1.125.194-2.22.534-3.257 1.011a.041.041 0 0 0-.021.018C.356 6.024-.213 9.047.066 12.032c.001.014.01.028.021.037a13.276 13.276 0 0 0 3.995 2.02.05.05 0 0 0 .056-.019c.308-.42.582-.863.818-1.329a.05.05 0 0 0-.01-.059.051.051 0 0 0-.018-.011 8.875 8.875 0 0 1-1.248-.595.05.05 0 0 1-.02-.066.051.051 0 0 1 .015-.019c.084-.063.168-.129.248-.195a.05.05 0 0 1 .051-.007c2.619 1.196 5.454 1.196 8.041 0a.052.052 0 0 1 .053.007c.08.066.164.132.248.195a.051.051 0 0 1-.004.085 8.254 8.254 0 0 1-1.249.594.05.05 0 0 0-.03.03.052.052 0 0 0 .003.041c.24.465.515.909.817 1.329a.05.05 0 0 0 .056.019 13.235 13.235 0 0 0 4.001-2.02.049.049 0 0 0 .021-.037c.334-3.451-.559-6.449-2.366-9.106a.034.034 0 0 0-.02-.019Zm-8.198 7.307c-.789 0-1.438-.724-1.438-1.612 0-.889.637-1.613 1.438-1.613.807 0 1.45.73 1.438 1.613 0 .888-.637 1.612-1.438 1.612Zm5.316 0c-.788 0-1.438-.724-1.438-1.612 0-.889.637-1.613 1.438-1.613.807 0 1.451.73 1.438 1.613 0 .888-.631 1.612-1.438 1.612Z"/>
        </svg>
        Join Discord
    </a>

    <div class="max-w-7xl mx-auto">
        <header class="py-16 md:py-24 text-center flex flex-col items-center">
            <h1 class="reth-title">RETH</h1>
            <div class="reth-title-underline"></div>
            <p class="reth-subtitle">OFFICIAL SCRIPT HUB</p>
            <p class="powered-by">Powered by Scriptblox</p>
        </header>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="SEARCH FOR SCRIPTS..." class="reth-search">
        </div>

        <div id="scriptGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            </div>
    </div>

    <div id="scriptModal" class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center hidden opacity-0">
        <div class="modal-content relative">
            <button onclick="closeModal()" class="absolute top-8 right-8 text-zinc-600 hover:text-white font-bold uppercase text-[10px] tracking-widest transition-colors">Close [X]</button>
            
            <h2 id="modalTitle" class="text-2xl font-black uppercase italic mb-2 tracking-tighter"></h2>
            
            <div id="modalStats" class="stats-row mb-3"></div>
            
            <p id="modalGame" class="text-[11px] text-zinc-500 font-bold uppercase tracking-widest mb-10"></p>
            
            <div class="flex gap-4 mb-8">
                <div onclick="copyFromModal()" id="modalCopyBtn" class="btn-copy-main flex-1 mb-0">COPY SCRIPT</div>
            </div>

            <div class="space-y-3">
                <p class="text-[9px] text-zinc-600 font-bold uppercase tracking-widest">Source Code Output:</p>
                <div id="modalScript" class="script-box"></div>
            </div>
        </div>
    </div>

    <script>
        const scriptGrid = document.getElementById('scriptGrid');
        const modal = document.getElementById('scriptModal');
        const searchInput = document.getElementById('searchInput');
        let scriptsData = [];

        /**
         * Fetch Scripts from Scriptblox API
         * If query is empty, it fetches the latest/recommended scripts.
         */
        async function fetchScripts(query = "") {
            const baseUrl = query 
                ? `https://scriptblox.com/api/script/search?q=${encodeURIComponent(query)}&max=50`
                : `https://scriptblox.com/api/script/fetch?page=1&max=50`; 
            
            const proxyUrl = `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(baseUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                if (data && data.result) {
                    // Scriptblox API structure varies slightly between search and fetch
                    scriptsData = data.result.scripts || data.result.docs || [];
                    renderScripts(scriptsData);
                }
            } catch (error) {
                console.error("Error fetching scripts:", error);
                scriptGrid.innerHTML = '<p class="text-center text-zinc-700 uppercase font-black py-20">Failed to load scripts.</p>';
            }
        }

        /**
         * Format numbers with commas (e.g., 1000 -> 1,000)
         */
        function formatNumber(num) {
            return (num || 0).toLocaleString();
        }

        /**
         * Render Script Cards into the Grid
         */
        function renderScripts(scripts) {
            const placeholderImg = "https://via.placeholder.com/400x225/050505/222222?text=RETH+HUB";
            
            if (scripts.length === 0) {
                scriptGrid.innerHTML = '<p class="text-center text-zinc-700 uppercase font-black col-span-full py-20">No scripts found.</p>';
                return;
            }

            scriptGrid.innerHTML = scripts.map((s, index) => {
                // Handling Image URL
                let thumb = placeholderImg;
                if (s.image && !s.image.includes('http')) {
                    thumb = `https://scriptblox.com${s.image}`;
                } else if (s.game && s.game.imageUrl) {
                    thumb = s.game.imageUrl;
                }

                // Key System Logic
                const keyClass = s.key ? "key-required" : "keyless";
                const keyText = s.key ? "Key Required" : "Keyless";

                return `
                <div class="reth-card p-6 group" onclick="openModal(${index})">
                    <div class="relative aspect-video bg-zinc-950 rounded-2xl mb-5 overflow-hidden">
                        <div class="key-tag ${keyClass}">${keyText}</div>
                        
                        <img src="${thumb}" 
                             class="w-full h-full object-cover opacity-50 group-hover:opacity-100 transition duration-700 ease-in-out" 
                             onerror="this.src='${placeholderImg}'">
                        
                        <div class="absolute top-3 right-3 status-badge">
                            <span class="status-dot ${s.isPatched ? 'patched' : 'working'}"></span>
                            ${s.isPatched ? 'Patched' : 'Working'}
                        </div>
                    </div>

                    <div class="stats-row">
                        <span class="stat-view">👁 ${formatNumber(s.views)}</span>
                        <span class="stat-like">👍 ${formatNumber(s.likeCount)}</span>
                        <span class="stat-dislike">👎 ${formatNumber(s.dislikeCount)}</span>
                    </div>

                    <div class="btn-copy-main" onclick="event.stopPropagation(); copyByIndex(${index}, this)">
                        COPY LOADSTRING
                    </div>

                    <div class="flex-grow">
                        <h3 class="text-sm font-black uppercase truncate mb-1 tracking-tight">${s.title}</h3>
                        <p class="text-[9px] text-zinc-600 font-bold uppercase tracking-widest truncate">
                            ${s.game ? s.game.name : 'Universal'}
                        </p>
                    </div>
                </div>`;
            }).join('');
        }

        /**
         * Open Modal with Script Details
         */
        function openModal(index) {
            const s = scriptsData[index];
            const modalEl = document.getElementById('scriptModal');
            
            document.getElementById('modalTitle').innerText = s.title;
            document.getElementById('modalGame').innerText = s.game ? s.game.name : 'Universal Script';
            document.getElementById('modalScript').innerText = s.script || "-- No Script Provided --";
            
            document.getElementById('modalStats').innerHTML = `
                <span class="stat-view">${formatNumber(s.views)} VIEWS</span>
                <span class="stat-like">${formatNumber(s.likeCount)} LIKES</span>
                <span class="stat-dislike">${formatNumber(s.dislikeCount)} DISLIKES</span>
            `;

            modalEl.classList.remove('hidden');
            setTimeout(() => modalEl.classList.add('opacity-100'), 10);
            document.body.style.overflow = 'hidden'; // Prevent scroll
        }

        /**
         * Close Modal
         */
        function closeModal() {
            const modalEl = document.getElementById('scriptModal');
            modalEl.classList.remove('opacity-100');
            setTimeout(() => {
                modalEl.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }, 300);
        }

        /**
         * Copy Logic for Modal
         */
        function copyFromModal() {
            const code = document.getElementById('modalScript').innerText;
            const btn = document.getElementById('modalCopyBtn');
            
            navigator.clipboard.writeText(code).then(() => {
                const originalText = btn.innerText;
                btn.innerText = "COPIED TO CLIPBOARD!";
                btn.style.backgroundColor = "#22c55e";
                btn.style.color = "#ffffff";
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = "#ffffff";
                    btn.style.color = "#000000";
                }, 2000);
            });
        }

        /**
         * Copy Logic for Card Button
         */
        function copyByIndex(index, btn) {
            const code = scriptsData[index].script;
            navigator.clipboard.writeText(code).then(() => {
                const originalText = btn.innerText;
                btn.innerText = "COPIED!";
                btn.style.backgroundColor = "#22c55e";
                btn.style.color = "#ffffff";
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = "#ffffff";
                    btn.style.color = "#000000";
                }, 1500);
            });
        }

        /**
         * Event Listeners
         */
        
        // Search input with debounce
        let typingTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                fetchScripts(e.target.value);
            }, 500);
        });

        // Load recommended scripts on startup
        window.onload = () => {
            fetchScripts("");
        };
    </script>
</body>
</html>
